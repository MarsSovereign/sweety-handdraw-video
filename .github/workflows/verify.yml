name: Verify packaged skill
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install with the bundled setup script (FFmpeg, CJK fonts on Linux, venv)
        run: |
          bash skills/sweety-handdraw-video/scripts/setup.sh
          bash skills/sweety-handdraw-video/scripts/setup.sh --check
          echo "PY=$HOME/.local/share/sweety-handdraw-video/venv/bin/python" >> "$GITHUB_ENV"
      - name: Report font discovery and rare-glyph coverage
        run: |
          if command -v fc-match >/dev/null; then fc-match -f '%{file}|%{index}|%{family}\n' 'sans-serif:lang=zh-cn'; fi
          "$PY" skills/sweety-handdraw-video/scripts/fonts.py --text 犇羴鱻龘囧槑
      - name: Verify integrity and regressions
        run: |
          "$PY" tools/release.py check
          "$PY" -m unittest discover -s tools -p 'test*.py' -v
          "$PY" skills/sweety-handdraw-video/scripts/validate_package.py
          "$PY" -m unittest discover -s skills/sweety-handdraw-video/scripts -p 'test*.py' -v
      - name: Exercise offline pipeline and package
        run: |
          "$PY" skills/sweety-handdraw-video/scripts/smoke_test.py --output /tmp/handdraw-ci
          "$PY" tools/package.py --output dist
      - name: Report encoded stream timing
        if: always()
        run: |
          ffmpeg -version | head -1
          if test -f /tmp/handdraw-ci/outputs/film.mp4; then
            ffprobe -v error -show_entries stream=codec_name,duration,nb_frames,start_time -of json /tmp/handdraw-ci/outputs/film.mp4
            "$PY" -c "import wave; p='/tmp/handdraw-ci/work/mix.wav'; w=wave.open(p); print('Mixed WAV seconds:', w.getnframes()/w.getframerate())"
            cat /tmp/handdraw-ci/work/timing.json
          fi
